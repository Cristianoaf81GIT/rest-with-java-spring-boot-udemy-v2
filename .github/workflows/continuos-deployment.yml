name: Continuos Integration and Delivery with github actions

on:
  push:
    branches:
      - main # Dispara a action quando houver push na branch main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nome-da-sua-imagem:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nome-da-sua-imagem:${{ github.sha }}
