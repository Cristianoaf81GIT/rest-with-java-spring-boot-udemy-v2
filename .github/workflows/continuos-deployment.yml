name: Continuous Integration and Delivery with GitHub Actions

on:
  push:
    branches:
      - main # Dispara a action quando houver push na branch main
  pull_request:
    branches:
      - main

# Boa pratica: concede apenas as permissoes necessarias
permissions:
  contents: read

# Cancela execucoes antigas do mesmo fluxo quando um novo commit chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e validacao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Instala o JDK 21 no runner (mesma versao do pom.xml e do Dockerfile)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar o projeto com Maven
        # -DskipTests porque os testes dependem de src/main/resources/env.properties
        # (arquivo nao versionado). Para rodar os testes no CI, gere esse arquivo
        # ou forneca as variaveis de ambiente antes deste passo e remova a flag.
        run: ./mvnw -B -ntp -DskipTests package

  docker:
    name: Build e Push da imagem Docker
    needs: build
    # Publica a imagem somente em push na branch main (nao em pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Secrets necessarios no repositorio:
      #   DOCKERHUB_USERNAME -> usuario do Docker Hub
      #   DOCKERHUB_TOKEN    -> access token do Docker Hub (nao a senha)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rest-with-springboot-v2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rest-with-springboot-v2:${{ github.sha }}
          # Cache de camadas entre execucoes (o runner comeca limpo a cada run)
          cache-from: type=gha
          cache-to: type=gha,mode=max
