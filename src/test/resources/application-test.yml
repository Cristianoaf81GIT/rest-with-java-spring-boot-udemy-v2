# ativa configs de cors globalmente
cors:
  originPatterns: http://localhost:8080,http://www.google.com.br,https://google.com.br,http://localhost:3000

file:
  upload-dir: ../../../files/

email:
  subject: ${EMAIL_SUBJECT}
  message: ${EMAIL_MESSAGE}

server:
  port: 0

security:
  jwt:
    token:
      secret-key: ${SECRET_KEY}
      expire-lenght: ${TOKEN_EXPIRATION}

spring:
  application:
    name: rest-with-java-spring-boot-udemy-v2

  config:
    import: ./env.properties

  datasource:
    driver-class-name: ${DRIVER_CLASS_NAME}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 50000
  mail:
    host: ${EMAIL_SMTP}
    port: ${EMAIL_SMTP_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true

  jpa:
    hibernate:
      ddl-auto: ${DDL_OPTS}
      show-sql: ${HIBERNATE_SHOW_SQL}

    # nao e filho de hibernate
    open-in-view: ${OPEN_IN_VIEW_OPTS}

  # configuracoes de multpart para upload/download
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215 MB

# nao e filho de spring
logging:
  level:
    ${PACKAGE_01}: ${LOGGING_PACKAGE}
    #root: DEBUG

spring-docs:
  paths-to-match:
    - /api/**/v1/**
  swagger-ui:
    user-root-path: true
